<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON Viewer — Tools</title>

  <!-- JSONEditor CSS -->
  <link href="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.3/dist/jsoneditor.min.css" rel="stylesheet">

  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding:20px; }
    #input { width:100%; height:140px; font-family: monospace; margin-bottom:8px; }
    #editor { height:520px; border:1px solid #ddd; border-radius:6px; padding:6px; background:#fff; }
    button { margin-right:8px; padding:6px 10px; }
  </style>
</head>
<body>
  <h1>JSON Viewer</h1>
  <p>Paste JSON in the box and click <strong>Load</strong>.</p>

  <textarea id="input" placeholder='{"foo": "bar"}'></textarea>
  <br>
  <button id="load">Load</button>
  <button id="clear">Clear</button>
  <button id="pretty">Pretty → Editor</button>

  <div id="editor"></div>

  <!-- JSONEditor script -->
  <script src="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.3/dist/jsoneditor.min.js"></script>
  <script>
    const container = document.getElementById('editor');
    const options = { mode: 'tree', modes: ['tree','view','code'] };
    const editor = new JSONEditor(container, options);

    document.getElementById('load').addEventListener('click', () => {
      const raw = document.getElementById('input').value.trim();
      try {
        const obj = raw ? JSON.parse(raw) : {};
        editor.set(obj);
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
      }
    });

    document.getElementById('clear').addEventListener('click', () => {
      editor.set({});
      document.getElementById('input').value = '';
    });

    // If someone pastes valid JSON and wants to switch to the editor
    document.getElementById('pretty').addEventListener('click', () => {
      try {
        const obj = JSON.parse(document.getElementById('input').value || '{}');
        editor.set(obj);
      } catch(e) { alert('Invalid JSON: ' + e.message); }
    });
  </script>
</body>
</html>
